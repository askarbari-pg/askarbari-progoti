<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আসকরবাড়ী প্রগতি গ্রুপ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5136">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="প্রগতি গ্রুপ">
<style>
:root{
  --green:#0b5136; --green2:#0e6b47; --deep:#07331f; --gold:#c9a227; --gold2:#e8c85a;
  --bg:#f2f5f1; --card:#ffffff; --ink:#1c2a22; --muted:#6b7a70; --line:#e2e9e3;
  --red:#b3261e; --blue:#1458a8; --shadow:0 6px 22px rgba(7,51,31,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0; font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:96px}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:15px; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; width:100%; background:#fff; color:var(--ink); outline:none; transition:border-color .2s, box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--green2); box-shadow:0 0 0 3px rgba(14,107,71,.15)}
label{font-size:13px; color:var(--muted); display:block; margin:10px 0 5px}
.hidden{display:none !important}

/* ---------- login ---------- */
#loginView{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px; background:radial-gradient(120% 90% at 50% 0%, #116b45 0%, var(--deep) 62%)}
.login-card{background:#fff; border-radius:26px; padding:30px 24px 24px; width:100%; max-width:400px; box-shadow:0 24px 60px rgba(0,0,0,.35); text-align:center; animation:rise .5s ease both}
.login-card img.logo{width:150px; max-width:60%; border-radius:14px}
.login-card h1{font-size:23px; margin:14px 0 2px; color:var(--green)}
.login-card .en{letter-spacing:2.5px; font-size:11.5px; color:var(--gold); font-weight:700; text-transform:uppercase}
.login-card .sub{color:var(--muted); font-size:13.5px; margin:10px 0 4px}
.login-card form{text-align:left; margin-top:8px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:13px 18px; font-size:15.5px; font-weight:700; transition:transform .15s, box-shadow .15s, filter .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--green2),var(--green)); color:#fff; width:100%; box-shadow:0 8px 20px rgba(11,81,54,.35)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#3a2c00}
.btn-ghost{background:#eef3ee; color:var(--green)}
.btn-sm{padding:8px 13px; font-size:13.5px; border-radius:11px}
.btn-pdf{background:linear-gradient(135deg,#d64541,#a51f1a); color:#fff; box-shadow:0 5px 14px rgba(179,38,30,.3)}
.btn-jpg{background:linear-gradient(135deg,#2f7fd0,#1458a8); color:#fff; box-shadow:0 5px 14px rgba(20,88,168,.3)}
.linklike{background:none; border:none; color:var(--green2); font-size:13.5px; font-weight:600; padding:6px}
.demo-hint{background:#fdf6e0; border:1px dashed var(--gold); border-radius:12px; padding:10px 12px; font-size:13px; color:#6d5710; margin-top:14px; text-align:left}

/* ---------- app frame ---------- */
header.app{position:sticky; top:0; z-index:40; background:linear-gradient(120deg,var(--deep),var(--green) 55%,var(--green2)); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:11px; box-shadow:0 4px 18px rgba(7,51,31,.35)}
header.app img{width:42px; height:42px; border-radius:11px; background:#fff; padding:2px}
header.app .t{flex:1; min-width:0}
header.app .t b{font-size:16.5px; display:block; line-height:1.25}
header.app .t span{font-size:11.5px; opacity:.85; letter-spacing:1.2px; text-transform:uppercase}
.userchip{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14); padding:6px 8px 6px 12px; border-radius:999px; font-size:13px; max-width:46vw}
.userchip span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.userchip button{background:#fff; color:var(--green); border:none; border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:700}
main{max-width:760px; margin:0 auto; padding:16px 14px 8px}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.anim{animation:rise .45s ease both}
.card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:17px; margin-bottom:14px; border:1px solid rgba(11,81,54,.05)}
.card h3{margin:0 0 10px; font-size:16.5px; color:var(--green); display:flex; align-items:center; gap:8px}
.card h3 .ic{font-size:18px}
.muted{color:var(--muted); font-size:13.5px}
.alert{background:#fdecea; color:var(--red); border-radius:12px; padding:11px 13px; font-size:14px; margin-bottom:12px}
.ok{background:#e6f4ec; color:var(--green); border-radius:12px; padding:11px 13px; font-size:14px; margin-bottom:12px}

/* ---------- stats ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:14px}
.stat{border-radius:18px; padding:15px 14px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow); animation:rise .45s ease both}
.stat::after{content:""; position:absolute; right:-22px; top:-22px; width:84px; height:84px; border-radius:50%; background:rgba(255,255,255,.14)}
.stat .v{font-size:21px; font-weight:800; line-height:1.2}
.stat .k{font-size:13px; opacity:.92; margin-top:2px}
.stat.g1{background:linear-gradient(135deg,#0e6b47,#0b5136)}
.stat.g2{background:linear-gradient(135deg,#c0392b,#8e241c)}
.stat.g3{background:linear-gradient(135deg,#8a6d1c,#c9a227)}
.stat.g4{background:linear-gradient(135deg,#1458a8,#0d3f7d)}
.stat.clickable{cursor:pointer}
.stat.clickable:active{transform:scale(.98)}
.stat .go{position:absolute; right:12px; bottom:10px; font-size:12px; background:rgba(255,255,255,.22); padding:3px 9px; border-radius:999px}
.subrows{margin-top:6px}
.subrow{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px dashed var(--line); font-size:14.5px}
.subrow:last-child{border-bottom:none}
.subrow b{font-size:15.5px}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700}
.pill.green{background:#e2f2e7; color:var(--green)}
.pill.red{background:#fbe7e5; color:var(--red)}
.pill.gold{background:#fdf3d3; color:#7a5f06}
.pill.grey{background:#edf0ed; color:var(--muted)}

/* ---------- notices ---------- */
.notice{border-left:5px solid var(--gold); background:linear-gradient(90deg,#fffbe9,#fff); border-radius:14px; padding:13px 15px; margin-bottom:10px; box-shadow:0 3px 12px rgba(7,51,31,.07)}
.notice b{font-size:15px; color:var(--green)}
.notice .d{font-size:12px; color:var(--muted); margin:2px 0 5px}
.notice p{margin:0; font-size:14px; line-height:1.55}

/* ---------- tables & lists ---------- */
table{width:100%; border-collapse:collapse; font-size:13.8px}
th{background:#eef4ee; color:var(--green); text-align:left; padding:9px 8px; font-size:13px}
td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto; margin:0 -4px; padding:0 4px}
.rowline{display:flex; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px dashed var(--line); font-size:14.5px}
.rowline:last-child{border-bottom:none}
.acct{border:1.5px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; background:linear-gradient(180deg,#fbfdfb,#fff)}
.acct .head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.acct .head b{font-size:15.5px; color:var(--green)}
.mini{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:11px 0}
.mini div{background:#f0f5f0; border-radius:11px; padding:8px 6px; text-align:center}
.mini .v{font-weight:800; font-size:15px; color:var(--green)}
.mini .k{font-size:11.5px; color:var(--muted)}
.invrow{display:flex; align-items:center; gap:7px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:14px; flex-wrap:wrap}
.invrow:last-child{border-bottom:none}
.invrow .grow{flex:1; min-width:130px}
.person-head{display:flex; align-items:center; gap:10px; margin:14px 0 8px}
.person-head .av{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--green2),var(--green)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px}
.committee{display:flex; gap:12px; align-items:center; padding:11px 2px; border-bottom:1px dashed var(--line)}
.committee:last-child{border-bottom:none}
.committee .av{width:44px; height:44px; border-radius:14px; background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#4a3800; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex-shrink:0}

/* ---------- bottom nav ---------- */
nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(7,51,31,.10)}
nav.bottom button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12.5px; font-weight:600; color:var(--muted); padding:7px 2px; border-radius:15px; transition:all .2s}
nav.bottom button svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
nav.bottom button.on{background:linear-gradient(135deg,var(--green2),var(--green)); color:#fff; box-shadow:0 6px 16px rgba(11,81,54,.35)}
.backbar{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.backbar button{background:#fff; border:1.5px solid var(--line); border-radius:11px; padding:8px 13px; font-weight:700; color:var(--green); font-size:14px}
.backbar b{font-size:16px; color:var(--green)}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:80; background:rgba(4,26,16,.72); display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:18px 12px}
.modal .box{background:#fff; border-radius:20px; width:100%; max-width:520px; padding:16px; animation:rise .3s ease both}
.modal img.inv{width:100%; border-radius:12px; border:1px solid var(--line)}
.modal .acts{display:flex; gap:8px; margin-top:13px}
.modal .acts .btn{flex:1}
details.admin-sec{border:1.5px solid var(--line); border-radius:14px; padding:6px 13px 13px; margin-bottom:11px; background:#fcfdfc}
details.admin-sec summary{font-weight:700; color:var(--green); font-size:15px; padding:9px 0 3px; cursor:pointer}
.credit{margin-top:20px; padding-top:13px; border-top:1px solid var(--line); font-size:13px; color:#66766b; text-align:center}
.credit a{color:var(--green); font-weight:700; text-decoration:none}
.checkline{display:flex; align-items:center; gap:9px; padding:7px 0; font-size:14.5px}
.checkline input{width:19px; height:19px; accent-color:var(--green)}
@media (max-width:380px){ .stat .v{font-size:18px} .mini .v{font-size:13.5px} }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView">
  <div class="login-card">
    <img class="logo" src="logo.jpg" alt="আসকরবাড়ী প্রগতি গ্রুপ লোগো">
    <h1>আসকরবাড়ী প্রগতি গ্রুপ</h1>
    <div class="en">Askarbari Progoti Group</div>
    <div id="loginMsg"></div>
    <form onsubmit="event.preventDefault(); doLogin();">
      <label>ইউজারনেইম</label>
      <input id="li_user" autocomplete="username" placeholder="যেমন: m26-001">
      <label>পাসওয়ার্ড</label>
      <input id="li_pass" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড">
      <div style="height:14px"></div>
      <button class="btn btn-primary" type="submit">লগইন করুন →</button>
    </form>
    <div class="credit">© 2026 Askarbari Progoti Group<br>• Developed by <a href="https://www.linkedin.com/in/mdabdullabd" target="_blank" rel="noopener">Md. Abdulla</a><br><span style="opacity:.6; font-size:11px">অ্যাপ v1.7.2 · ইন্টারফেস <span id="uiVerLbl"></span></span></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appView" class="hidden">
  <header class="app">
    <img src="emblem.png" alt="">
    <div class="t"><b>আসকরবাড়ী প্রগতি গ্রুপ</b><span>Askarbari Progoti Group</span></div>
    <div class="userchip"><span id="whoami"></span><button onclick="doLogout()">লগআউট</button></div>
  </header>
  <main>
    <div id="msg"></div>
    <div id="content"></div>
  </main>
  <nav class="bottom" id="bottomNav"></nav>
</div>

<!-- ===================== INVOICE MODAL ===================== -->
<div id="invModal" class="modal hidden">
  <div class="box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
      <b style="color:var(--green); font-size:16px">🧾 ইনভয়েস</b>
      <button class="btn btn-ghost btn-sm" onclick="closeInvoice()">✕ বন্ধ</button>
    </div>
    <img class="inv" id="invImg" alt="ইনভয়েসের ছবি">
    <div class="acts">
      <button class="btn btn-pdf" onclick="downloadInvoicePdf()">⬇ PDF ডাউনলোড</button>
      <button class="btn btn-jpg" onclick="downloadInvoiceJpg()">⬇ JPG ডাউনলোড</button>
    </div>
    <p class="muted" style="margin:10px 0 0">PDF যেকোনো PDF ভিউয়ারে খুলবে, JPG ছবি হিসেবে গ্যালারিতে/WhatsApp-এ পাঠানো যাবে।</p>
  </div>
</div>

<script src="seed.js"></script>
<script src="emblem-data.js"></script>
<script src="seal-data.js"></script>
<script>
"use strict";
/* =====================================================================
   আসকরবাড়ী প্রগতি গ্রুপ — অ্যাপ v1.7
   - একটি লগইনেই ব্যক্তির সব লিংক করা হিসাব (persons.memberIds)
   - ইনভয়েস: ক্যানভাসে প্রফেশনাল ডিজাইন → আসল PDF ও JPG ডাউনলোড
   - ৪টি ট্যাব: আমার হিসাব | ড্যাশবোর্ড | প্রজেক্ট | পরিচালনা
   ===================================================================== */
var S = { token:"", role:"", username:"", personId:"", memberIds:[], data:null, tab:"account", sub:null, monthKey:"" };
var DEMO_MODE = false;
var demoDb = null;
var APP_VERSION_CODE = 9999; // ওয়েব সংস্করণ: APK-আপডেট ব্যানার কখনো দেখাবে না (মূল ফাইলে 10)
var APP_VERSION_NAME = "1.7.2";
var UI_VERSION = 11; // এই ইন্টারফেসের সংস্করণ (অটো-আপডেট চেকে ব্যবহৃত)

var DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwLeuHNxJhiileh1lmWGSMD_Ob1jrzFmPQB__66rO_iDDm5rKSqID3gcOLwwyQ8vVjV/exec";
function apiUrl(){ return localStorage.getItem("pg_api_url") || DEFAULT_API_URL; }
function isDemo(){ return DEMO_MODE || !apiUrl(); }
function saveSession(){ var j = JSON.stringify({ token:S.token, role:S.role, username:S.username, personId:S.personId, memberIds:S.memberIds }); localStorage.setItem("pg_session", j); try { if (window.AndroidBridge && AndroidBridge.saveSessionNative) AndroidBridge.saveSessionNative(j); } catch(e){} }
function loadSession(){
  try { var raw = localStorage.getItem("pg_session"); if (!raw && window.AndroidBridge && AndroidBridge.readSessionNative) { try { raw = AndroidBridge.readSessionNative(); if (raw) localStorage.setItem("pg_session", raw); } catch(e){} } var s = JSON.parse(raw || "null");
    if (s && s.username) { S.token=s.token||"demo"; S.role=s.role||"member"; S.username=s.username; S.personId=s.personId||""; S.memberIds=s.memberIds||[]; return true; } } catch(e){}
  return false;
}
function dataCacheKey(){ return "pg_data_cache_" + (S.username || "anon"); }
function saveDataCache(){ try { if (S.data) localStorage.setItem(dataCacheKey(), JSON.stringify({ t: Date.now(), data: S.data })); } catch (e) {} }
function loadDataCache(){ try { var c = JSON.parse(localStorage.getItem(dataCacheKey()) || "null"); return (c && c.data) ? c.data : null; } catch (e) { return null; } }
function clearSession(){ try { localStorage.removeItem(dataCacheKey()); } catch (e) {} localStorage.removeItem("pg_session"); try { if (window.AndroidBridge && AndroidBridge.clearSessionNative) AndroidBridge.clearSessionNative(); } catch(e){} S.token=""; S.role=""; S.username=""; S.personId=""; S.memberIds=[]; S.data=null; }
function saveApiUrl(){ var el = document.getElementById("sv_api"); if (!el) return; localStorage.setItem("pg_api_url", el.value.trim()); alert("সার্ভার ঠিকানা সেভ হয়েছে।"); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmt(n){ return "৳" + Number(n||0).toLocaleString("en-IN"); }
function bnNum(x){ return String(x).replace(/[0-9]/g, function(d){ return "০১২৩৪৫৬৭৮৯"[+d]; }); }
function fmtBn(n){ return "৳" + bnNum(Number(n||0).toLocaleString("en-IN")); }
var BN_MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function currentBnMonth(){ var d = new Date(); return BN_MONTHS[d.getMonth()] + " " + bnNum(d.getFullYear()); }
function msg(t, kind){ var el=$("msg"); if(el) el.innerHTML = t ? '<div class="'+(kind==="ok"?"ok":"alert")+'">'+esc(t)+'</div>' : ""; }
function isAdmin(){ return S.role === "admin"; }
function val(id){ var e=$(id); return e ? e.value.trim() : ""; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function overdue(a){ return a.status !== "সম্পন্ন" && a.deadline && a.deadline < todayStr(); }

/* ================= API স্তর ================= */
async function api(action, payload){
  payload = payload || {};
  if (isDemo()) return demoApi(action, payload);
  var body = Object.assign({}, payload, { action: action, token: S.token });
  var res = await fetch(apiUrl(), { method: "POST", body: JSON.stringify(body) });
  var json = await res.json();
  if (!json.ok) throw new Error(json.error || "সার্ভার ত্রুটি");
  return json.data !== undefined ? json.data : json;
}

/* ================= ডেমো মোড (এই ডিভাইসেই ডেটা থাকে) ================= */
function demoLoad(){
  if (demoDb) return demoDb;
  try { var saved = JSON.parse(localStorage.getItem("pg_demo_db") || "null"); if (saved && saved.members) demoDb = saved; } catch(e){}
  if (!demoDb) demoDb = JSON.parse(JSON.stringify(window.SEED_DATA));
  // পুরনো সেভ করা ডেমো ডেটায় নতুন কাঠামো (persons/committee) না থাকলে সিড থেকে যোগ করো
  if (!demoDb.persons) demoDb.persons = JSON.parse(JSON.stringify(window.SEED_DATA.persons));
  if (!demoDb.committee) demoDb.committee = JSON.parse(JSON.stringify(window.SEED_DATA.committee));
  if (!demoDb.notices) demoDb.notices = [];
  return demoDb;
}
function demoSave(){ localStorage.setItem("pg_demo_db", JSON.stringify(demoDb)); }
function nextId(arr, prefix){ var mx=0; (arr||[]).forEach(function(r){ var mm=String(r.id).match(/(\d+)$/); if(mm) mx=Math.max(mx,+mm[1]); }); var n=mx+1; return prefix+"-"+(n<10?"00"+n:n<100?"0"+n:""+n); }
function nextMemberId(arr){ var mx=0; (arr||[]).forEach(function(r){ var mm=String(r.id).match(/M26-(\d+)$/); if(mm) mx=Math.max(mx,+mm[1]); }); var n=mx+1; return "M26-"+(n<10?"00"+n:n<100?"0"+n:""+n); }
function recomputeMemberTotals(db){
  (db.members||[]).forEach(function(m){
    var deps = (db.deposits||[]).filter(function(d){ return d.memberId===m.id && d.status==="অনুমোদিত"; });
    m.totalDeposit = deps.reduce(function(a,d){ return a + (+d.amount||0); }, 0);
    m.totalUnits = deps.reduce(function(a,d){ return a + (+d.units||0); }, 0);
  });
}
async function demoApi(action, p){
  var db = demoLoad();
  function done(data){ demoSave(); return data; }
  if (action === "login"){
    var u = String(p.username||"").toLowerCase();
    if (u === "admin") return { role:"admin", username:"admin", personId:"", memberIds: db.members.map(function(m){return m.id;}) };
    var person = (db.persons||[]).find(function(x){ return String(x.username||"").toLowerCase() === u; });
    if (!person){ // যেকোনো লিংক করা সদস্য-ইউজারনেইম দিয়েও লগইন করা যাবে
      person = (db.persons||[]).find(function(x){ return (x.memberIds||[]).some(function(mid){ var m = db.members.find(function(y){return y.id===mid;}); return m && String(m.username||"").toLowerCase() === u; }); });
    }
    if (!person) throw new Error("ইউজারনেইম পাওয়া যায়নি");
    return { role:"member", username: person.username, personId: person.id, memberIds: person.memberIds.slice() };
  }
  if (action === "getData"){ recomputeMemberTotals(db); var gout = JSON.parse(JSON.stringify(db)); gout.allDeposits = gout.deposits; return gout; }
  if (action === "addDeposit"){
    var m = db.members.find(function(x){ return x.id === p.memberId; });
    if (!m) throw new Error("সদস্য পাওয়া যায়নি");
    var amt = +p.amount || 0, up = +db.settings.unitPrice || 1000;
    var dep = { id: nextId(db.deposits, "DEP"), memberId: m.id, memberName: m.name, date: p.date || todayStr(), amount: amt, unitPrice: up, units: Math.round((amt/up)*100)/100, month: p.month || "", status: p.status || "অনুমোদিত", method: p.method || "", receipt: p.receipt || "", note: p.note || "", invoiceSent: false };
    db.deposits.push(dep);
    db.emailLog = db.emailLog || [];
    db.emailLog.push({ to: m.email || "", depositId: dep.id, date: todayStr(), status: "ইনভয়েস তৈরি হয়েছে (অ্যাপে ডাউনলোডযোগ্য)", error: "" });
    recomputeMemberTotals(db);
    return done({ deposit: dep });
  }
  if (action === "addMember"){
    var nm = { id: nextMemberId(db.members), name: p.name, mobile: p.mobile||"", email: p.email||"", joinDate: p.joinDate || todayStr(), status: "সক্রিয়", totalDeposit: 0, totalUnits: 0, username: "", passwordSet: false, nid: p.nid || "" };
    nm.username = nm.id.toLowerCase();
    db.members.push(nm);
    var person = null;
    if (p.personId) person = (db.persons||[]).find(function(x){ return x.id === p.personId; });
    if (!person){
      person = { id: nextId(db.persons, "P"), name: (p.personName || p.name || "").replace(/-\d+$/, ""), mobile: p.mobile||"", email: p.email||"", username: nm.username, passwordSet: false, memberIds: [] };
      db.persons.push(person);
    }
    person.memberIds.push(nm.id);
    return done({ member: nm, person: person });
  }
  if (action === "setPersonLogin"){
    var pr = (db.persons||[]).find(function(x){ return x.id === p.personId; });
    if (!pr) throw new Error("ব্যক্তি পাওয়া যায়নি");
    if (p.username) pr.username = String(p.username).toLowerCase();
    if (p.password) pr.passwordSet = true;
    if (Array.isArray(p.memberIds)) pr.memberIds = p.memberIds.slice();
    return done({ person: pr });
  }
  if (action === "updateMember"){
    var um = db.members.find(function(x){ return x.id === p.id; });
    if (!um) throw new Error("সদস্য পাওয়া যায়নি");
    ["name","mobile","email","joinDate","status","photo","nid"].forEach(function(k){ if (p[k] !== undefined) um[k] = p[k]; });
    return done({ member: um });
  }
  if (action === "updateDeposit"){
    var ud = (db.deposits||[]).find(function(x){ return x.id === p.id; });
    if (!ud) throw new Error("জমা পাওয়া যায়নি");
    ["date","month","method","receipt","note","status"].forEach(function(k){ if (p[k] !== undefined) ud[k] = p[k]; });
    if (p.amount !== undefined){ ud.amount = +p.amount || 0; ud.units = Math.round((ud.amount / (ud.unitPrice || (+db.settings.unitPrice || 1000))) * 100) / 100; }
    recomputeMemberTotals(db);
    return done({ deposit: ud });
  }
  if (action === "deleteDeposit"){
    var dd = (db.deposits||[]).find(function(x){ return x.id === p.id; });
    if (!dd) throw new Error("জমা পাওয়া যায়নি");
    db.deposits = db.deposits.filter(function(x){ return x.id !== p.id; });
    recomputeMemberTotals(db);
    return done({});
  }
  if (action === "deleteTransaction"){ db.transactions = (db.transactions||[]).filter(function(x){ return x.id !== p.id; }); return done({}); }
  if (action === "addTransaction"){ var tx = Object.assign({ id: nextId(db.transactions, "TXN") }, p); db.transactions.push(tx); return done({ transaction: tx }); }
  if (action === "addInvestment"){ var iv = Object.assign({ id: nextId(db.investments, "INV") }, p); db.investments.push(iv); return done({ investment: iv }); }
  if (action === "updateInvestment"){ var iv2 = (db.investments||[]).find(function(x){ return x.id === p.id; }); if (iv2) Object.assign(iv2, p.fields || {}); return done({}); }
  if (action === "addNotice"){ var nt = Object.assign({ id: nextId(db.notices, "NTC") }, p); db.notices.unshift(nt); return done({ notice: nt }); }
  if (action === "deleteNotice"){ db.notices = (db.notices||[]).filter(function(x){ return x.id !== p.id; }); return done({}); }
  if (action === "addMeeting"){ var mt = Object.assign({ id: nextId(db.meetings, "MTG") }, p); db.meetings.push(mt); return done({ meeting: mt }); }
  if (action === "addAction"){ var ac = Object.assign({ id: nextId(db.actions, "ACT"), status: "শুরু হয়নি", note: "", completedDate: "" }, p); db.actions.push(ac); return done({ actionItem: ac }); }
  if (action === "updateAction"){ var ac2 = (db.actions||[]).find(function(x){ return x.id === p.id; }); if (ac2) Object.assign(ac2, p.fields || {}); return done({}); }
  if (action === "addCommittee"){ var cm = Object.assign({ id: nextId(db.committee, "CMT") }, p); db.committee.push(cm); return done({ committee: cm }); }
  if (action === "updateCommittee"){ var uc = (db.committee||[]).find(function(x){ return x.id === p.id; }); if (!uc) throw new Error("কমিটির সদস্য পাওয়া যায়নি"); ["name","role","memberId","mobile","note"].forEach(function(k){ if (p[k] !== undefined) uc[k] = p[k]; }); return done({ committee: uc }); }
  if (action === "deleteAction"){ db.actions = (db.actions||[]).filter(function(x){ return x.id !== p.id; }); return done({}); }
  if (action === "setMyPhoto"){
    (S.memberIds || []).forEach(function(id){ var m = db.members.find(function(x){ return x.id === id; }); if (m) m.photo = p.photo || ""; });
    return done({});
  }
  if (action === "setPaymentInfo"){ db.settings.paymentInfo = p.text || ""; return done({}); }
  if (action === "setDocuments"){ db.settings.documents = Array.isArray(p.documents) ? p.documents : []; return done({}); }
  if (action === "deleteCommittee"){ db.committee = (db.committee||[]).filter(function(x){ return x.id !== p.id; }); return done({}); }
  throw new Error("অজানা অ্যাকশন: " + action);
}

/* ================= হিসাব-নিকাশ (derived) ================= */
function members(){ return (S.data && S.data.members) || []; }
function persons(){ return (S.data && S.data.persons) || []; }
function findMember(id){ return members().find(function(x){ return x.id === id; }) || null; }
function findPerson(id){ return persons().find(function(x){ return x.id === id; }) || null; }
function myPerson(){ return S.personId ? findPerson(S.personId) : null; }
function personOfMember(mid){ return persons().find(function(p){ return (p.memberIds||[]).indexOf(mid) >= 0; }) || null; }
function myAccounts(){ return S.memberIds.map(findMember).filter(Boolean); }
function approvedDeps(list){ return (list || S.data.deposits || []).filter(function(d){ return d.status === "অনুমোদিত"; }); }
function depsOf(mid){ return (S.data.deposits || []).filter(function(d){ return d.memberId === mid; }); }
function totals(){
  var deps = approvedDeps(), depSum = deps.reduce(function(a,d){ return a + (+d.amount||0); }, 0);
  var units = deps.reduce(function(a,d){ return a + (+d.units||0); }, 0);
  var txs = S.data.transactions || [];
  var incInv = txs.filter(function(t){ return t.type === "আয়" && t.category === "বিনিয়োগ থেকে আয়"; }).reduce(function(a,t){ return a + (+t.amount||0); }, 0);
  var incOther = txs.filter(function(t){ return t.type === "আয়" && t.category !== "বিনিয়োগ থেকে আয়"; }).reduce(function(a,t){ return a + (+t.amount||0); }, 0);
  var expense = txs.filter(function(t){ return t.type === "ব্যয়"; }).reduce(function(a,t){ return a + (+t.amount||0); }, 0);
  var totalIncome = depSum + incInv + incOther;
  var netFund = totalIncome - expense;
  var invs = S.data.investments || [];
  var invested = invs.reduce(function(a,i){ return a + (+i.amount||0); }, 0);
  var invValue = invs.reduce(function(a,i){ return a + (+(i.currentValue != null ? i.currentValue : i.amount)||0); }, 0);
  var netAssets = netFund - invested + invValue;
  return { depSum: depSum, incInv: incInv, incOther: incOther, totalIncome: totalIncome, expense: expense, netFund: netFund, units: units, invested: invested, invValue: invValue, netAssets: netAssets, unitValue: units > 0 ? Math.round(netAssets / units) : (+S.data.settings.unitPrice || 1000) };
}
/* মাসভিত্তিক জমা হিস্ট্রি: | মাস | সক্রিয় সদস্য | জমা সম্পন্ন | জমা বাকি | */
function depositHistory(){
  var active0 = members().filter(function(m){ return m.status === "সক্রিয়"; }).length;
  if (S.data.depositHistoryAgg && !S.data.allDeposits) { // allDeposits থাকলে সরাসরি হিসাব হয়
    return S.data.depositHistoryAgg.map(function(r){
      return { key: r.month, month: r.month, latest: r.date || "", active: active0, done: r.doneCount, due: Math.max(0, active0 - r.doneCount) };
    }).sort(function(a,b){ return a.latest < b.latest ? 1 : -1; });
  }
  var byMonth = {};
  (S.data.allDeposits || S.data.deposits || []).forEach(function(d){
    var key = d.month || (d.date || "").slice(0,7);
    if (!key) return;
    if (!byMonth[key]) byMonth[key] = { month: d.month || key, latest: d.date || "", doneSet: {} };
    if (d.date > byMonth[key].latest) byMonth[key].latest = d.date;
    if (d.status === "অনুমোদিত") byMonth[key].doneSet[d.memberId] = true;
  });
  var active = members().filter(function(m){ return m.status === "সক্রিয়"; }).length;
  return Object.keys(byMonth).map(function(k){
    var r = byMonth[k], done = Object.keys(r.doneSet).length;
    return { key: k, month: r.month, latest: r.latest, active: active, done: done, due: Math.max(0, active - done) };
  }).sort(function(a,b){ return a.latest < b.latest ? 1 : -1; });
}
function memberOptions(sel){ return members().map(function(m){ return '<option value="'+m.id+'"'+(m.id===sel?" selected":"")+'>'+esc(m.name)+' ('+m.id+')</option>'; }).join(""); }
function personOptions(sel){ return persons().map(function(p){ return '<option value="'+p.id+'"'+(p.id===sel?" selected":"")+'>'+esc(p.name)+' — '+(p.memberIds||[]).length+'টি হিসাব</option>'; }).join(""); }
function avatarHtml(photo, name, size){
  size = size || 40;
  if (photo) return '<img src="'+photo+'" alt="" style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #c9a227">';
  return '<div class="av" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.45)+'px;flex:none">'+esc((name||"?").charAt(0))+'</div>';

/* ---------- রিপোর্ট ক্যানভাস (মাল্টি-পেজ টেবিল) → JPG/PDF ---------- */
function drawReportPages(title, subtitle, headers, rows, totalRow, widths, aligns, groupSizes){
  var W = 1240, H = 1754, MX = 92, TW = W - MX * 2;
  var GREEN = "#0b5136", GREEN2 = "#0e6b47", DEEP = "#07331f", GOLD = "#c9a227", INK = "#22312a", MUT = "#66766b", LINE = "#d9e2da";
  var ws = widths || headers.map(function(){ return 1; });
  var wsum = ws.reduce(function(a, b){ return a + b; }, 0);
  var cols = ws.map(function(w){ return TW * w / wsum; });
  var ROWH = 46, HEADH = 50, FOOT = 118;
  var BASE = 22, MINF = 14, PAD = 14;
  // পেজ-ভাগের ইউনিট: groupSizes থাকলে একটি গ্রুপ একাধিক পেজে ভাঙা যাবে না
  var units = [];
  if (groupSizes && groupSizes.length){
    var gi = 0;
    groupSizes.forEach(function(n){ var u = []; for (var k = 0; k < n; k++) u.push(gi++); units.push(u); });
    while (gi < rows.length) { units.push([gi++]); }
  } else rows.forEach(function(r, i){ units.push([i]); });
  if (totalRow) units.push(["TOTAL"]);
  function capacity(first){ var top = first ? 348 : 216; return Math.floor((H - FOOT - top - HEADH) / ROWH); }
  var pages = [], cur = [], cap = capacity(true);
  units.forEach(function(u){
    if (u.length > cap) { u.forEach(function(ri){ if (cur.length >= cap) { pages.push(cur); cur = []; cap = capacity(false); } cur.push(ri); }); return; }
    if (cur.length + u.length > cap) { pages.push(cur); cur = []; cap = capacity(false); }
    u.forEach(function(ri){ cur.push(ri); });
  });
  if (cur.length || !pages.length) pages.push(cur);
  var groupStart = {};
  if (groupSizes && groupSizes.length){
    var idx = 0;
    groupSizes.forEach(function(n){ groupStart[idx] = { text: rows[idx] ? rows[idx][0] : "", count: n }; idx += n; });
  }
  function fit(x, text, maxW, bold){
    // সব সেলে একই ফন্ট সাইজ (BASE) — লম্বা লেখা ছোট করা হয় না, প্রয়োজনে "…" দিয়ে কাটা হয়
    text = String(text == null ? "" : text);
    x.font = (bold ? "700 " : "") + BASE + "px sans-serif";
    if (x.measureText(text).width > maxW) {
      while (text.length && x.measureText(text + "…").width > maxW) text = text.slice(0, -1);
      text += "…";
    }
    return text;
  }
  function cell(x, text, cx, cy, colW, bold, align, color){
    var t = fit(x, text, colW - PAD * 2, bold);
    x.fillStyle = color || INK;
    if (align === "r") { x.textAlign = "right"; x.fillText(t, cx + colW - PAD, cy); }
    else if (align === "c") { x.textAlign = "center"; x.fillText(t, cx + colW / 2, cy); }
    else { x.textAlign = "left"; x.fillText(t, cx + PAD, cy); }
    x.textAlign = "left";
  }
  var totalPages = pages.length;
  return pages.map(function(pageRows, pi){
    var first = pi === 0;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var x = cv.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
    x.strokeStyle = GREEN; x.lineWidth = 6; x.strokeRect(24, 24, W - 48, H - 48);
    x.strokeStyle = GOLD; x.lineWidth = 2; x.strokeRect(40, 40, W - 80, H - 80);
    var top;
    if (first){
      var grad = x.createLinearGradient(0, 56, W, 56); grad.addColorStop(0, DEEP); grad.addColorStop(.55, GREEN); grad.addColorStop(1, GREEN2);
      x.fillStyle = grad; x.fillRect(56, 56, W - 112, 132);
      x.fillStyle = "#ffffff"; x.font = "700 42px sans-serif"; x.fillText("আসকরবাড়ী প্রগতি গ্রুপ", MX, 118);
      x.fillStyle = "#e8c85a"; x.font = "700 21px sans-serif"; x.fillText("A S K A R B A R I   P R O G O T I   G R O U P", MX, 156);
      x.fillStyle = GREEN; x.font = "800 36px sans-serif"; x.fillText(title, MX, 262);
      x.fillStyle = MUT; x.font = "22px sans-serif"; x.fillText(subtitle || "", MX, 300);
      x.strokeStyle = GOLD; x.lineWidth = 3; x.beginPath(); x.moveTo(MX, 322); x.lineTo(W - MX, 322); x.stroke();
      top = 348;
    } else {
      x.fillStyle = GREEN; x.fillRect(56, 56, W - 112, 84);
      x.fillStyle = "#ffffff"; x.font = "700 27px sans-serif"; x.fillText("আসকরবাড়ী প্রগতি গ্রুপ", MX, 110);
      x.fillStyle = MUT; x.font = "22px sans-serif"; x.textAlign = "right"; x.fillText(title, W - MX, 110); x.textAlign = "left";
      top = 216;
    }
    x.fillStyle = GREEN; roundRect(x, MX, top, TW, HEADH, 8); x.fill();
    var cx = MX;
    headers.forEach(function(hd, i){ cell(x, hd, cx, top + HEADH * 0.68, cols[i], true, aligns && aligns[i], "#ffffff"); cx += cols[i]; });
    var ry = top + HEADH;
    pageRows.forEach(function(ri, rIdx){
      var isTotal = ri === "TOTAL";
      var cells = isTotal ? totalRow : rows[ri];
      var bg = isTotal ? "#e9f3ea" : (rIdx % 2 === 0 ? "#f7faf7" : null);
      if (bg) { x.fillStyle = bg; x.fillRect(MX, ry, TW, ROWH); }
      var cx2 = MX;
      cells.forEach(function(c, ci){
        var thisCx = cx2; cx2 += cols[ci];
        if (groupSizes && ci === 0 && !isTotal) return; // মার্জ সেলে আলাদাভাবে আঁকা হয়
        cell(x, c, thisCx, ry + ROWH * 0.68, cols[ci], isTotal, aligns && aligns[ci]);
      });
      x.strokeStyle = LINE; x.lineWidth = 1.5; x.beginPath(); x.moveTo(MX, ry + ROWH); x.lineTo(MX + TW, ry + ROWH); x.stroke();
      ry += ROWH;
    });
    if (groupSizes && groupSizes.length){
      Object.keys(groupStart).forEach(function(startStr){
        var start = +startStr, g = groupStart[startStr], pos = [];
        pageRows.forEach(function(ri, rIdx){ if (typeof ri === "number" && ri >= start && ri < start + g.count) pos.push(rIdx); });
        if (!pos.length) return;
        var y0 = top + HEADH + pos[0] * ROWH, hh = pos.length * ROWH;
        x.fillStyle = "#eef5ee"; x.fillRect(MX, y0, cols[0], hh);
        x.strokeStyle = "#b9cfba"; x.lineWidth = 2; x.strokeRect(MX, y0, cols[0], hh);
        x.fillStyle = GREEN;
        var t = fit(x, g.text, cols[0] - PAD * 2, true);
        x.textAlign = "center"; x.fillText(t, MX + cols[0] / 2, y0 + hh / 2 + 8); x.textAlign = "left";
      });
    }
    x.fillStyle = MUT; x.font = "20px sans-serif"; x.textAlign = "center";
    x.fillText("আসকরবাড়ী প্রগতি গ্রুপ অ্যাপ থেকে তৈরি · " + bnNum(todayStr()) + " · পৃষ্ঠা " + bnNum(pi + 1) + "/" + bnNum(totalPages), W / 2, H - 84);
    x.textAlign = "left";
    return cv;
  });
}
function downloadReport(kind, title, subtitle, headers, rows, totalRow, widths, base, aligns, groupSizes){
  var pages = drawReportPages(title, subtitle, headers, rows, totalRow, widths, aligns, groupSizes);
  function fail(){ msg("ডাউনলোড তৈরি করা যায়নি — আবার চেষ্টা করুন"); }
  function collect(i, acc, done){
    if (i >= pages.length) { done(acc); return; }
    canvasJpegBytes(pages[i], function(jpg){ acc.push({ jpg: jpg, w: pages[i].width, h: pages[i].height }); collect(i + 1, acc, done); }, fail);
  }
  if (kind === "pdf") {

/* ---------- রিপোর্ট পেজ (ডায়নামিক টেবিল) ---------- */
function monthlyReportRows(){
  var map = {}, order = [];
  function put(k, label){ if (!map[k]) { map[k] = { label: label || k, dep: 0, inc: 0, exp: 0 }; order.push(k); } return map[k]; }
  approvedDeps().forEach(function(d){ var k = (d.date || "").slice(0, 7); if (k) put(k, d.month || k).dep += +d.amount || 0; });
  (S.data.transactions || []).forEach(function(e){
    var k = (e.date || "").slice(0, 7); if (!k) return;
    var r = put(k);
    if (e.type === "ব্যয়") r.exp += +e.amount || 0; else r.inc += +e.amount || 0;
  });
  return order.sort().reverse().map(function(k){ var r = map[k]; return { label: r.label, dep: r.dep, inc: r.inc, exp: r.exp, net: r.dep + r.inc - r.exp }; });
}

var mePhotoVal = null; // null = ছবি অপরিবর্তিত; "" = ছবি নেই/সরানো; data-URL = নতুন ছবি
function setPhotoPreview(){
  var img = $("me_photo_preview"), ini = $("me_photo_initial");
  if (img){ if (mePhotoVal){ img.src = mePhotoVal; img.style.display = ""; } else img.style.display = "none"; }
  if (ini) ini.style.display = mePhotoVal ? "none" : "";
}
function onMemberPhotoPick(input){
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      var SZ = 128, cv = document.createElement("canvas"); cv.width = SZ; cv.height = SZ;
      var cx = cv.getContext("2d");
      var sc = Math.max(SZ / im.width, SZ / im.height), w = im.width * sc, hg = im.height * sc;
      cx.drawImage(im, (SZ - w) / 2, (SZ - hg) / 2, w, hg);
      var url = cv.toDataURL("image/jpeg", 0.72);
      if (url.length > 48000) url = cv.toDataURL("image/jpeg", 0.5);
      mePhotoVal = url; setPhotoPreview();
      msg("ছবি বাছাই হয়েছে — 'সংশোধন সংরক্ষণ করুন' চাপলে সেভ হবে", "ok");
    };
    im.onerror = function(){ msg("ছবিটি পড়া যায়নি — অন্য ছবি বেছে নিন"); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}

/* সদস্যের নিজের ছবি: বাছলেই সরাসরি সেভ (অ্যাডমিনের কাজ নয়) */

      var SZ = 128, cv = document.createElement("canvas"); cv.width = SZ; cv.height = SZ;
      var cx = cv.getContext("2d");
      var sc = Math.max(SZ / im.width, SZ / im.height), w = im.width * sc, hg = im.height * sc;
      cx.drawImage(im, (SZ - w) / 2, (SZ - hg) / 2, w, hg);

var emblemImg = null;
function preloadEmblem(){
  /* লোগো data-URL আকারে এম্বেড করা — file:// ছবি ক্যানভাসে আঁকলে ক্যানভাস
     "tainted" হয়ে toDataURL/toBlob ব্লক হয়ে যায় (v1.2-এর বাগ)। data-URL
     ছবিতে এই সমস্যা হয় না, তাই ইনভয়েস সবসময় এক্সপোর্টযোগ্য থাকে। */
  var im = new Image();
  im.onload = function(){ emblemImg = im; };
  im.src = window.EMBLEM_DATA_URL || "emblem.png";
}
var sealImg = null;

}
/* ক্যানভাস এক্সপোর্টযোগ্য কিনা যাচাই; না হলে ছবি ছাড়া আবার এঁকে দাও */
function safeInvoiceCanvas(d){
  var cv = drawInvoiceCanvas(d);
  try { cv.toDataURL("image/jpeg", 0.5); return cv; }
  catch (e) {
    emblemImg = null; sealImg = null; // ছবি বাদ দিয়ে ভেক্টর মনোগ্রামে আবার আঁকা — এটা কখনো taint হয় না
    return drawInvoiceCanvas(d);
  }
}
function findDep(id){ return (S.data.deposits || []).find(function(d){ return d.id === id; }) || null; }
function numWords(n){
  var ones = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  var tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(x){ return x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x % 10 ? "-" + ones[x % 10] : ""); }
  function three(x){ return (x >= 100 ? ones[Math.floor(x/100)] + " Hundred" + (x % 100 ? " " : "") : "") + (x % 100 ? two(x % 100) : ""); }
  n = Math.floor(Math.abs(+n || 0)); if (n === 0) return "Zero";
  var parts = [];
  var cr = Math.floor(n / 10000000); n %= 10000000;
  var lk = Math.floor(n / 100000); n %= 100000;
  var th = Math.floor(n / 1000); n %= 1000;
  if (cr) parts.push(three(cr) + " Crore");
  if (lk) parts.push(three(lk) + " Lakh");
  if (th) parts.push(three(th) + " Thousand");
  if (n) parts.push(three(n));
  return parts.join(" ");
}
function drawInvoiceCanvas(d){
  var m = findMember(d.memberId) || { name: d.memberName, id: d.memberId, mobile: "", email: "" };
  var W = 1240, H = 1754;
  var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  var x = cv.getContext("2d");
  var GREEN = "#0b5136", GREEN2 = "#0e6b47", DEEP = "#07331f", GOLD = "#c9a227", INK = "#1c2a22", MUT = "#66766b", LINE = "#d9e2da";
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
  /* বাইরের বর্ডার */
  x.strokeStyle = GREEN; x.lineWidth = 6; x.strokeRect(24, 24, W - 48, H - 48);
  x.strokeStyle = GOLD; x.lineWidth = 2; x.strokeRect(40, 40, W - 80, H - 80);
  /* হেডার ব্যান্ড */
  var grad = x.createLinearGradient(0, 56, W, 56); grad.addColorStop(0, DEEP); grad.addColorStop(.55, GREEN); grad.addColorStop(1, GREEN2);
  x.fillStyle = grad; x.fillRect(56, 56, W - 112, 236);
  /* লোগো */
  x.fillStyle = "#ffffff"; roundRect(x, 92, 88, 172, 172, 20); x.fill();
  if (emblemImg) { x.save(); roundRect(x, 100, 96, 156, 156, 16); x.clip(); x.drawImage(emblemImg, 100, 96, 156, 156); x.restore(); }
  else { x.fillStyle = GREEN; x.font = "800 110px sans-serif"; x.textAlign = "center"; x.fillText("A", 178, 218); x.textAlign = "left"; }
  x.fillStyle = "#ffffff"; x.font = "700 57px sans-serif"; x.fillText("আসকরবাড়ী প্রগতি গ্রুপ", 300, 152);
  x.fillStyle = "#e8c85a"; x.font = "700 30px sans-serif"; x.fillText("A S K A R B A R I   P R O G O T I   G R O U P", 302, 202);
  x.fillStyle = "rgba(255,255,255,.85)"; x.font = "28px sans-serif"; x.fillText("সঞ্চয় ও বিনিয়োগ সমবায় উদ্যোগ", 302, 248);
  /* শিরোনাম */
  x.fillStyle = GREEN; x.font = "800 44px sans-serif"; x.fillText("জমা রসিদ", 92, 372);
  x.fillStyle = MUT; x.font = "600 27px sans-serif"; x.fillText("DEPOSIT INVOICE", 92, 412);
  x.fillStyle = "#fdf3d3"; roundRect(x, W - 470, 322, 378, 58, 29); x.fill();
  x.fillStyle = "#7a5f06"; x.font = "700 29px sans-serif"; x.textAlign = "center"; x.fillText("ইনভয়েস নং: " + d.id, W - 281, 361); x.textAlign = "left";
  x.fillStyle = INK; x.font = "28px sans-serif"; x.fillText("তারিখ: " + bnNum(d.date || ""), W - 470, 428);
  /* সদস্যের তথ্য বক্স */
  x.fillStyle = "#f2f7f2"; roundRect(x, 92, 462, W - 184, 208, 16); x.fill();
  x.fillStyle = GREEN; x.font = "700 30px sans-serif"; x.fillText("সদস্যের তথ্য", 128, 516);
  x.fillStyle = INK; x.font = "30px sans-serif";
  x.fillText("নাম: " + (m.name || d.memberName || ""), 128, 572);
  x.fillText("সদস্য আইডি: " + (m.id || d.memberId || ""), 128, 624);
  x.fillText("মোবাইল: " + bnNum(m.mobile || "—"), 660, 572);
  x.fillText("ইমেইল: " + (m.email || "—"), 660, 624);
  /* বিবরণ টেবিল */
  var ty = 716;
  x.fillStyle = GREEN; roundRect(x, 92, ty, W - 184, 66, 12); x.fill();
  x.fillStyle = "#fff"; x.font = "700 30px sans-serif"; x.fillText("বিবরণ", 128, ty + 44); x.textAlign = "right"; x.fillText("পরিমাণ / তথ্য", W - 128, ty + 44); x.textAlign = "left";
  var rows = [
    ["জমার তারিখ", bnNum(d.date || "")],
    ["জমার মাস", d.month || "—"],
    ["পরিশোধের মাধ্যম", d.method || "—"],
    ["রসিদ / ট্রান্সাকশন নং", d.receipt || "—"],
    ["একক মূল্য", fmtBn(d.unitPrice || 1000)],
    ["এককের সংখ্যা", bnNum(d.units || 0) + " একক"]
  ];
  var ry = ty + 66;
  rows.forEach(function(r, i){
    if (i % 2 === 0) { x.fillStyle = "#f8faf8"; x.fillRect(92, ry, W - 184, 64); }
    x.fillStyle = INK; x.font = "29px sans-serif"; x.fillText(r[0], 128, ry + 42);

  var tg = x.createLinearGradient(92, 0, W - 92, 0); tg.addColorStop(0, GREEN); tg.addColorStop(1, GREEN2);
  x.fillStyle = tg; roundRect(x, 92, ry, W - 184, 96, 16); x.fill();
  x.fillStyle = "#fff"; x.font = "800 38px sans-serif"; x.fillText("মোট জমা", 128, ry + 61);

  if (d.note) x.fillText("নোট: " + String(d.note).replace(/\[ইমেইল প্রেরিত\]/g, "").trim(), 92, ry + 92);
  /* সই ও সিল */
  var sy = H - 300;
  /* বামে: সংগঠনের গোল সিল (আগের হিসাবরক্ষক/কোষাধ্যক্ষের জায়গায়) */
  if (sealImg) { x.drawImage(sealImg, 160, H - 358, 170, 170); }
  else { x.strokeStyle = GREEN; x.lineWidth = 3; x.beginPath(); x.arc(242, H - 278, 96, 0, Math.PI * 2); x.stroke(); x.fillStyle = GREEN; x.font = "800 54px sans-serif"; x.textAlign = "center"; x.fillText("A", 242, H - 260); x.textAlign = "left"; }
  /* ডানে: অর্থ ও দপ্তর সম্পাদকের সই — দাগের ঠিক ওপরে অনুমোদিত সিল */
  x.save(); x.translate(W - 242, sy - 82); x.rotate(-0.06);
  x.strokeStyle = GREEN2; x.lineWidth = 4; roundRect(x, -150, -44, 300, 88, 14); x.stroke();
  x.fillStyle = GREEN2; x.font = "800 40px sans-serif"; x.textAlign = "center"; x.fillText("✓ অনুমোদিত", 0, 15); x.restore(); x.textAlign = "left";
  x.strokeStyle = INK; x.lineWidth = 2;
  x.beginPath(); x.moveTo(W - 392, sy); x.lineTo(W - 92, sy); x.stroke();
  x.fillStyle = INK; x.font = "27px sans-serif"; x.fillText("অর্থ ও দপ্তর সম্পাদক", W - 392, sy + 44);
  /* ফুটার */
  x.fillStyle = GREEN; x.fillRect(56, H - 170, W - 112, 2.5);
  x.fillStyle = MUT; x.font = "24px sans-serif"; x.textAlign = "center";
  x.fillText("এই রসিদটি আসকরবাড়ী প্রগতি গ্রুপ অ্যাপ থেকে স্বয়ংক্রিয়ভাবে তৈরি — কোনো সই ছাড়াই বৈধ।", W / 2, H - 118);
  x.fillText("ধন্যবাদান্তে — আসকরবাড়ী প্রগতি গ্রুপ · তৈরি: " + bnNum(todayStr()), W / 2, H - 76);
  x.textAlign = "left";
  return cv;
}
function roundRect(x, a, b, w, h, r){
  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
}
function canvasJpegBytes(cv, cb, errCb){
  function fail(){ if (errCb) errCb(); }
  try {
    if (cv.toBlob) cv.toBlob(function(b){
      if (!b) { fail(); return; }
      b.arrayBuffer().then(function(ab){ cb(new Uint8Array(ab)); }).catch(fail);
    }, "image/jpeg", 0.92);
    else { var s = cv.toDataURL("image/jpeg", 0.92).split(",")[1]; cb(b64ToBytes(s)); }
  } catch (e) { fail(); }
}
function b64ToBytes(b64){
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function bytesToB64(bytes){
  var s = "", CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}
/* JPEG বাইটসকে আসল A4 PDF-এ মোড়ানো (এক বা একাধিক পৃষ্ঠা) */
function buildPdfFromJpegs(pages){
  var pw = 595, ph = 842; // A4 point
  var enc = function(s){ return b64ToBytes(btoa(s)); }; // ASCII-only অংশ
  var parts = [], pos = 0;
  function push(bytes){ parts.push(bytes); pos += bytes.length; }
  function pushStr(s){ push(enc(s)); }
  var header = "%PDF-1.4\n";
  pos = header.length; parts.push(enc(header));
  var off = [];
  var kids = pages.map(function(p, i){ return (3 + i * 3) + " 0 R"; }).join(" ");
  off[1] = pos; pushStr("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  off[2] = pos; pushStr("2 0 obj\n<< /Type /Pages /Kids [" + kids + "] /Count " + pages.length + " >>\nendobj\n");
  pages.forEach(function(pg, i){
    var pObj = 3 + i * 3, cObj = 4 + i * 3, iObj = 5 + i * 3;
    var content = "q\n" + pw + " 0 0 " + ph + " 0 0 cm\n/Im" + i + " Do\nQ\n";
    off[pObj] = pos; pushStr(pObj + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pw + " " + ph + "] /Resources << /XObject << /Im" + i + " " + iObj + " 0 R >> >> /Contents " + cObj + " 0 R >>\nendobj\n");
    off[cObj] = pos; pushStr(cObj + " 0 obj\n<< /Length " + content.length + " >>\nstream\n" + content + "endstream\nendobj\n");
    off[iObj] = pos; pushStr(iObj + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + pg.w + " /Height " + pg.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + pg.jpg.length + " >>\nstream\n");
    push(pg.jpg); pushStr("\nendstream\nendobj\n");
  });
  var size = 3 + pages.length * 3;
  var xrefPos = pos;
  var xref = "xref\n0 " + size + "\n0000000000 65535 f \n";
  for (var i = 1; i < size; i++) xref += ("0000000000" + off[i]).slice(-10) + " 00000 n \n";
  xref += "trailer\n<< /Size " + size + " /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF";
  pushStr(xref);
  var total = parts.reduce(function(a, p){ return a + p.length; }, 0);
  var out = new Uint8Array(total), o = 0;
  parts.forEach(function(p){ out.set(p, o); o += p.length; });
  return out;
}
function buildPdfFromJpeg(jpg, w, h){ return buildPdfFromJpegs([{ jpg: jpg, w: w, h: h }]); }
function saveBytes(filename, bytes, mime){
  if (window.AndroidBridge && typeof window.AndroidBridge.saveBase64 === "function"){
    window.AndroidBridge.saveBase64(filename, bytesToB64(bytes), mime);
  } else {
    var blob = new Blob([bytes], { type: mime });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
}
var currentInvoiceId = null;
function showInvoice(depId){
  var d = findDep(depId); if (!d) return;
  currentInvoiceId = depId;
  try {
    var cv = safeInvoiceCanvas(d);
    $("invImg").src = cv.toDataURL("image/jpeg", 0.92);
    $("invModal").classList.remove("hidden");
  } catch (e) { msg("ইনভয়েস দেখাতে সমস্যা হয়েছে: " + e.message); }
}
function closeInvoice(){ $("invModal").classList.add("hidden"); }
function invError(){ msg("ডাউনলোডে সমস্যা হয়েছে — আবার চেষ্টা করুন। সমস্যা থাকলে অ্যাডমিনকে জানান।"); }
function downloadInvoiceJpg(){
  var d = findDep(currentInvoiceId); if (!d) return;
  try {
    canvasJpegBytes(safeInvoiceCanvas(d), function(bytes){
      saveBytes("Invoice-" + d.id + ".jpg", bytes, "image/jpeg");
      msg("JPG ডাউনলোড শুরু হয়েছে — Downloads ফোল্ডারে দেখুন", "ok");
    }, invError);
  } catch (e) { invError(); }
}
function downloadInvoicePdf(){
  var d = findDep(currentInvoiceId); if (!d) return;
  try {
    var cv = safeInvoiceCanvas(d);
    canvasJpegBytes(cv, function(bytes){
      var pdf = buildPdfFromJpeg(bytes, cv.width, cv.height);
      saveBytes("Invoice-" + d.id + ".pdf", pdf, "application/pdf");
      msg("PDF ডাউনলোড শুরু হয়েছে — Downloads ফোল্ডারে দেখুন", "ok");
    }, invError);
  } catch (e) { invError(); }
}
function quickInvoice(depId, kind){
  currentInvoiceId = depId;
  if (kind === "pdf") downloadInvoicePdf(); else downloadInvoiceJpg();
}

/* ================= সব ইনভয়েস (অ্যাডমিন) ================= */
function vInvoices(){
  if (!isAdmin()) return '<div class="anim"><div class="card"><p class="muted">শুধু অ্যাডমিনের জন্য।</p></div></div>';
  var deps = (S.data.deposits || []).slice().sort(function(a, b){ return String(b.date || "").localeCompare(String(a.date || "")) || (a.id < b.id ? 1 : -1); });
  var h = '<div class="anim"><div class="backbar"><button onclick="goSub(null)">← ফিরুন</button><b>সব ইনভয়েস (' + bnNum(deps.length) + 'টি)</b></div><div class="card">';
  if (!deps.length) h += '<p class="muted">কোনো ইনভয়েস নেই।</p>';
  deps.forEach(function(d){
    h += '<div class="rowline" style="align-items:flex-start;gap:8px"><div style="flex:1;min-width:0"><b>' + esc(d.id) + '</b> · ' + esc(d.memberName || "") + '<br><span class="muted">' + esc(d.date || "") + ' · ' + esc(d.memberId || "") + ' · ' + esc(d.month || "") + ' · ' + esc(d.status || "") + '</span></div>'
      + '<div style="text-align:right;flex:none"><b>' + fmt(d.amount) + '</b><br><span style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="showInvoice(\'' + d.id + '\')">👁 দেখুন</button> <button class="btn btn-jpg btn-sm" onclick="quickInvoice(\'' + d.id + '\',\'jpg\')">JPG</button> <button class="btn btn-pdf btn-sm" onclick="quickInvoice(\'' + d.id + '\',\'pdf\')">PDF</button></span></div></div>';
  });
  return h + '</div></div>';
}

/* ================= আপডেট সিস্টেম (v1.7): APK + ইন্টারফেস অটো-আপডেট ================= */
var updateState = { apk: null, uiReady: false };
function dismissUpdateBanner(){ var b = $("updateBanner"); if (b) b.remove(); }
function applyUiUpdate(){ if (window.AndroidBridge && AndroidBridge.applyUi) { AndroidBridge.applyUi(); } else { location.reload(); } }
function renderUpdateBanner(){
  dismissUpdateBanner();
  var html = "";
  if (updateState.apk) html += '<div style="margin-bottom:' + (updateState.uiReady ? "10" : "0") + 'px">🆕 <b>নতুন সংস্করণ v' + esc(updateState.apk.apkVersionName || "") + ' এসেছে</b>' + (updateState.apk.apkNotes ? '<br><span style="opacity:.88">' + esc(updateState.apk.apkNotes) + '</span>' : "") + '<div style="margin-top:8px"><button class="btn btn-gold btn-sm" onclick="downloadApkUpdate()">⬆️ আপডেট করুন</button> <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="dismissUpdateBanner()">পরে</button></div></div>';
  if (updateState.uiReady) html += '<div>✨ <b>নতুন ইন্টারফেস ডাউনলোড হয়েছে</b><div style="margin-top:8px"><button class="btn btn-gold btn-sm" onclick="applyUiUpdate()">এখনই প্রয়োগ করুন</button> <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="dismissUpdateBanner()">পরে</button></div></div>';
  if (!html) return;
  var b = document.createElement("div");
  b.id = "updateBanner";
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:1200;background:#0b5136;color:#fff;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:14px";
  b.innerHTML = html;
  document.body.appendChild(b);
}
function checkForUpdates(){
  if (isDemo()) return;
  var base = apiUrl(); if (!base) return;
  fetch(base + (base.indexOf("?") >= 0 ? "&" : "?") + "action=version").then(function(r){ return r.json(); }).then(function(v){
    if (!v || !v.ok) return;
    if (v.apkUrl && (+v.apkVersionCode || 0) > APP_VERSION_CODE) { updateState.apk = v; renderUpdateBanner(); }
    if ((+v.uiVersion || 0) > UI_VERSION) maybeFetchUi(+v.uiVersion);
  }).catch(function(){});
}
var uiDlStarted = false;
function uiReadyRec(){ try { return JSON.parse(localStorage.getItem("pg_ui_ready") || "null"); } catch(e){ return null; } }
function maybeFetchUi(ver){
  var rec = uiReadyRec();
  if (rec && rec.v === ver) {
    // এই সংস্করণ আগেই ডাউনলোড হয়ে আছে: ১ ঘণ্টার মধ্যে হলে প্রয়োগের ব্যানার দেখাও, তার বেশি পুরনো হলে আর বিরক্ত নয়
    if (Date.now() - rec.t < 3600000) { updateState.uiReady = true; renderUpdateBanner(); }
    return;
  }
  if (uiDlStarted) return;
  uiDlStarted = true;
  fetchUiUpdate(ver);
}
function fetchUiUpdate(ver){
  // পছন্দের পথ: নেটিভ নিজে ডাউনলোড করে যাচাই করে রাখে (বড় HTML ব্রিজ দিয়ে পাঠানোর ঝুঁকি নেই)
  if (window.AndroidBridge && AndroidBridge.downloadUi) { AndroidBridge.downloadUi(apiUrl() + (apiUrl().indexOf("?") >= 0 ? "&" : "?") + "action=ui", ver); return; }
  // পুরনো নেটিভের জন্য আগের পথ
  fetch(apiUrl() + (apiUrl().indexOf("?") >= 0 ? "&" : "?") + "action=ui").then(function(r){ return r.text(); }).then(function(html){
    if (!html || html.length < 60000 || html.indexOf("UI_VERSION") < 0) { uiDlStarted = false; return; }
    if (window.AndroidBridge && AndroidBridge.saveUi) { AndroidBridge.saveUi(html, ver); onUiReady(true, ver); }
  }).catch(function(){ uiDlStarted = false; });
}
// নেটিভ ডাউনলোড শেষ হলে এটা ডাকা হয়
window.onUiReady = function(ok, ver){
  if (!ok) { uiDlStarted = false; return; }
  try { localStorage.setItem("pg_ui_ready", JSON.stringify({ v: ver, t: Date.now() })); } catch(e){}
  updateState.uiReady = true; renderUpdateBanner();
};
function downloadApkUpdate(){
  var u = updateState.apk && updateState.apk.apkUrl; if (!u) return;
  if (window.AndroidBridge && AndroidBridge.downloadApk) { AndroidBridge.downloadApk(u); msg("আপডেট ডাউনলোড শুরু হয়েছে — শেষ হলে ইনস্টলার নিজে থেকে খুলবে", "ok"); }
  else window.open(u, "_blank");
}

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
